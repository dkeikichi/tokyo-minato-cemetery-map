<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜港区 墓地距離マップ</title>
<style>
  :root { --bg: #eef1f0; --panel: #ffffff; --ink: #1b2326; --ink-2: #48555a; --accent: #1f5f9e; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #101517; --panel: #172024; --ink: #e5ecee; --ink-2: #b0bcc0; --accent: #86bbe6; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--ink);
         font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
  main { max-width: 420px; background: var(--panel); border-radius: 14px; padding: 28px 24px; line-height: 1.7; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
  a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>ページが見つかりません</h1>
  <p>URLが間違っているか、ページが移動した可能性があります。</p>
  <a href="/tokyo-minato-cemetery-map/">港区 墓地距離マップを開く →</a>
</main>
</body>
</html>
